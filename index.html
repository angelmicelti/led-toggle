<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de LED</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #141a2e;
      --text: #e8edf7;
      --muted: #8b95b2;
      --led-off: #2a3148;
      --led-on: #ff3b3b;
      --led-glow: rgba(255, 59, 59, 0.75);
      --track-off: #3a425c;
      --track-on: #c62828;
      --knob: #f4f7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #1c2748 0%, transparent 55%),
        var(--bg);
      color: var(--text);
    }

    .card {
      width: min(92vw, 380px);
      padding: 2.25rem 2rem 1.75rem;
      background: linear-gradient(180deg, #1a223c 0%, var(--panel) 100%);
      border: 1px solid #2a3558;
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    p.hint {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .led-wrap {
      position: relative;
      height: 160px;
      display: grid;
      place-items: center;
      margin-bottom: 1.5rem;
    }

    .halo {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--led-glow);
      filter: blur(28px);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .led {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5a6380 0%, var(--led-off) 62%);
      box-shadow:
        inset 0 8px 16px rgba(255, 255, 255, 0.12),
        inset 0 -10px 18px rgba(0, 0, 0, 0.45),
        0 8px 18px rgba(0, 0, 0, 0.35);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .status {
      margin: 0 0 1.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .track {
      width: 72px;
      height: 38px;
      border-radius: 999px;
      background: var(--track-off);
      position: relative;
      transition: background 0.2s ease;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .knob {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--knob);
      transition: transform 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .label {
      font-weight: 600;
    }

    body.on .halo {
      opacity: 1;
      transform: scale(1);
    }

    body.on .led {
      background: radial-gradient(circle at 35% 28%, #ffb3b3 0%, var(--led-on) 55%, #8b1010 100%);
      box-shadow:
        inset 0 8px 16px rgba(255, 255, 255, 0.35),
        0 0 28px var(--led-glow),
        0 8px 18px rgba(0, 0, 0, 0.35);
    }

    body.on .status {
      color: #ff8a8a;
    }

    body.on .track {
      background: var(--track-on);
    }

    body.on .knob {
      transform: translateX(34px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Simulador de LED</h1>
    <p class="hint">Pulsa el interruptor para encender o apagar el LED.</p>

    <div class="led-wrap" aria-hidden="true">
      <div class="halo"></div>
      <div class="led"></div>
    </div>

    <p class="status" id="status">APAGADO</p>

    <label class="toggle">
      <input type="checkbox" id="switch" role="switch" aria-checked="false" aria-label="Encender o apagar el LED" />
      <span class="track"><span class="knob"></span></span>
      <span class="label" id="label">Encender</span>
    </label>
  </main>

  <script>
    const toggle = document.getElementById("switch");
    const status = document.getElementById("status");
    const label = document.getElementById("label");

    function render() {
      const on = toggle.checked;
      document.body.classList.toggle("on", on);
      status.textContent = on ? "ENCENDIDO" : "APAGADO";
      label.textContent = on ? "Apagar" : "Encender";
      toggle.setAttribute("aria-checked", String(on));
    }

    toggle.addEventListener("change", render);
    render();
  </script>
</body>
</html>
